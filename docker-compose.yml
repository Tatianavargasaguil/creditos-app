services:
  creditos_db:
    image: postgres:16-alpine
    container_name: creditos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-creditos}
      POSTGRES_USER: ${DB_USER:-creditos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-creditos-local}
    ports:
      - "5440:5432"
    volumes:
      - creditos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditos -d creditos"]
      interval: 10s
      timeout: 5s
      retries: 5

  creditos_backend:
    build:
      context: ./backend
    container_name: creditos_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-creditos}:${DB_PASSWORD:-creditos-local}@creditos_db:5432/${DB_NAME:-creditos}
      CORS_ORIGINS: http://localhost:4210,http://127.0.0.1:4210
      AUTH_SECRET: ${AUTH_SECRET:-change-this-in-production-use-strong-random-key-min-32-chars}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_MAIL_FROM: ${GRAPH_MAIL_FROM:-creditos@carmaxcolombia.com.co}
      GRAPH_SAVE_TO_SENT_ITEMS: ${GRAPH_SAVE_TO_SENT_ITEMS:-true}
    ports:
      - "8010:8010"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      creditos_db:
        condition: service_healthy

  creditos_frontend:
    build:
      context: ./frontend
    container_name: creditos_frontend
    restart: unless-stopped
    ports:
      - "4210:4210"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - creditos_backend

  creditos_nginx:
    image: nginx:1.27-alpine
    container_name: creditos_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - creditos_frontend
      - creditos_backend

volumes:
  creditos_pgdata:
